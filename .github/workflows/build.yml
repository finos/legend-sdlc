name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on:
  push:
    # Branch pushes only -- and `branches` rather than `tags-ignore` on
    # purpose. A push filter that names only tags stops the workflow running
    # for branch pushes as well, because branches are then the undefined ref;
    # naming every branch here leaves *tags* undefined instead, which is what
    # actually skips them.
    # A release tag lands on a commit this workflow has already built, so
    # building it again on the tag push spends a second run on it and hands
    # `Publish Test Results` a duplicate set of results for the same commit.
    branches:
      - '**'
  pull_request:
  
jobs:
  build:
    name: Build
    if: "!startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Cache Maven dependencies
      uses: actions/cache@v5
      env:
        cache-name: cache-mvn-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25
        java-package: jdk
        server-id: central
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD

    - name: Configure git
      run: |
        git config --global committer.email "infra@finos.org"
        git config --global committer.name "FINOS Admin"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Download deps and plugins
      run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies

    - name: Collect Workflow Telemetry
      uses: runforesight/workflow-telemetry-action@v1
      with:
        theme: dark

    - name: Build + Test
      if: (github.repository != 'finos/legend-sdlc') || (github.ref != 'refs/heads/master')
      run: mvn install javadoc:javadoc -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ

    - name: Build + Test + Sonar + Docker Snapshot
      if: (github.repository == 'finos/legend-sdlc') && (github.ref == 'refs/heads/master')
      env:
        DOCKER_USERNAME: finos
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: mvn javadoc:javadoc install -P sonar,docker-snapshot -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: legend-sdlc-test-reports/surefire-reports-aggregate/*.xml

    - name: Upload CI Event
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: event-file
        path: ${{ github.event_path }}
