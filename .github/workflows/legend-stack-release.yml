name: Legend Stack Release

on:
  repository_dispatch:
    types: [legend-stack-release]

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  MAVEN_OPTS: -Xmx4g

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Check the release branch
        run: |
          set -euo pipefail
          # Both the stack-version commit and the version bump below commit
          # onto this branch, so it has to still be where it was when the run
          # started. Fail here, before anything is built or published. This is
          # not the only guard: both pushes are plain and never forced, so git
          # still rejects them if the branch moves later in the run.
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tip} after this run was dispatched. Nothing has been published; dispatch the release again."
            exit 1
          fi

      - name: Check release version is unused
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
          TAG: ${{ github.event.repository.name }}-${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::releaseVersion must be MAJOR.MINOR.PATCH; got '${RELEASE_VERSION}'."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; ${RELEASE_VERSION} has been released."
            exit 1
          fi
          # The branch has to be on a snapshot, and the release must not go
          # backwards from it. The tag check above catches re-releasing a
          # version that shipped; this catches a typo naming one that never
          # did, which nothing else would notice.
          current="$(python3 -c 'import xml.etree.ElementTree as ET; ns="{http://maven.apache.org/POM/4.0.0}"; print(ET.parse("pom.xml").getroot().find(ns + "properties").find(ns + "revision").text)')"
          case "${current}" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::The root pom is at ${current}, not a snapshot; this branch is not in a releasable state."
              exit 1
              ;;
          esac
          base="${current%-SNAPSHOT}"
          if [ "$( { echo "${base}"; echo "${RELEASE_VERSION}"; } | sort -V | head -n 1 )" != "${base}" ]; then
            echo "::error::releaseVersion ${RELEASE_VERSION} is below the branch's current version ${current}."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Update Legend Stack Version Upgrade
        run: |
          pureVersion="${{ github.event.client_payload.legendPureVersion }}"
          sharedVersion="${{ github.event.client_payload.legendSharedVersion }}"
          engineVersion="${{ github.event.client_payload.legendEngineVersion }}"
          echo "Legend Pure version: $engineVersion, Legend Pure version: $pureVersion, Legend Shared version: $sharedVersion"
          
          if [ -n "$sharedVersion" ]; then
            mvn versions:set-property -Dproperty=legend.shared.version -DnewVersion=${sharedVersion}
          fi
          if [ -n "$pureVersion" ]; then
            mvn versions:set-property -Dproperty=legend.pure.version -DnewVersion=${pureVersion}
          fi
          if [ -n "$engineVersion" ]; then
            mvn versions:set-property -Dproperty=legend.engine.version -DnewVersion=${engineVersion}
          fi

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Build + Test
        run: mvn clean install javadoc:javadoc -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ

      - name: Configure and start GitLab container
        run: docker run --detach
          --hostname localhost
          --env GITLAB_OMNIBUS_CONFIG="gitlab_rails['initial_root_password'] = 'ac0018BD19066353'"
          --publish 8090:80
          --name gitlab
          gitlab/gitlab-ee:12.10.14-ee.0

      - name: Wait until gitlab container is up and running
        run: sleep 450

      - name: Gitlab Docker Test
        run: mvn verify javadoc:javadoc -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ -P test-gitlab-docker

      - name: Shutdown GitLab container
        run: docker stop gitlab

      - name: Commit Legend Stack Version Upgrade
        run: |
          pureVersion="${{ github.event.client_payload.legendPureVersion }}"
          sharedVersion="${{ github.event.client_payload.legendSharedVersion }}"
          engineVersion="${{ github.event.client_payload.legendEngineVersion }}"
          
          if [ -n "$sharedVersion" ] || [ -n "$engineVersion" ] || [ -n "$pureVersion" ]; then
            git add pom.xml
            git commit -m "Legend Stack Versions upgrade"
            git push origin master
          fi    

      - name: Verify the release version resolves in every pom
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          # flatten-maven-plugin is what rewrites the revision property into
          # the poms that get published, and it is the same goal the deploy
          # below runs at process-resources. Run it on its own first:
          # autoPublish is on, so a pom that reaches Maven Central still
          # carrying an unresolved property cannot be withdrawn.
          mvn -B -q -Drevision="${RELEASE_VERSION}" flatten:flatten
          if grep -rlF '${revision}' --include='.flattened-pom.xml' .; then
            echo "::error::A pom above still carries an unresolved revision property; flatten-maven-plugin did not resolve it."
            exit 1
          fi
          count="$(find . -name .flattened-pom.xml | wc -l)"
          echo "${count} poms flattened to ${RELEASE_VERSION}"
          [ "${count}" -gt 0 ]

      - name: Build and deploy release
        # `clean` matters here: `Build + Test` and `Gitlab Docker Test` above
        # have already run the lifecycle over this workspace, at the snapshot
        # version. Re-entering it lets plugins act on their own previous
        # output rather than on a clean build of the commit being tagged.
        # release:perform used to avoid this by building in a fresh
        # target/checkout.
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
        run: mvn -B -e -Drevision="${RELEASE_VERSION}" clean deploy -P release,docker

      - name: Create and push git tag
        env:
          TAG: ${{ github.event.repository.name }}-${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Compute and set next SNAPSHOT
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION}"
          nextSnapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          # Committed onto the commit that was built, deployed and tagged --
          # which is the stack-version commit, if there was one -- never onto
          # whatever the remote tip has become, so the push below is a plain
          # fast-forward: if anything landed on the branch while this ran, git
          # rejects it rather than reverting a revision somebody else changed.
          git checkout -B "${GITHUB_REF_NAME}" HEAD
          sed -i "s|<revision>.*</revision>|<revision>${nextSnapshot}</revision>|" pom.xml
          if git diff --quiet -- pom.xml; then
            echo "::error::sed left pom.xml unchanged; set <revision> to ${nextSnapshot} by hand on ${GITHUB_REF_NAME}."
            exit 1
          fi
          git add pom.xml
          git commit -m "Bump version to ${nextSnapshot}"
          git push origin "${GITHUB_REF_NAME}"
