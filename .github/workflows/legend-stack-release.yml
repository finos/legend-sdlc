name: Legend Stack Release

on:
  repository_dispatch:
    types: [legend-stack-release]

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  MAVEN_OPTS: -Xmx4g

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Verify nothing landed since this run was dispatched
        run: |
          set -euo pipefail
          # The version bump at the end of this run commits onto the commit
          # built here, so a branch that has moved turns that push into a
          # non-fast-forward. Fail now, before anything is deployed or tagged,
          # rather than after. This is not the only guard: that push is plain
          # and never forced, so git still rejects it if the branch moves
          # between this check and the bump.
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tip} after this run was dispatched. Nothing has been deployed or tagged; dispatch the release again."
            exit 1
          fi

      - name: Check release version is unused
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
          TAG: ${{ github.event.repository.name }}-${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::releaseVersion must be MAJOR.MINOR.PATCH; got '${RELEASE_VERSION}'."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; ${RELEASE_VERSION} has been released."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Update Legend Stack Version Upgrade
        run: |
          pureVersion="${{ github.event.client_payload.legendPureVersion }}"
          sharedVersion="${{ github.event.client_payload.legendSharedVersion }}"
          engineVersion="${{ github.event.client_payload.legendEngineVersion }}"
          echo "Legend Pure version: $engineVersion, Legend Pure version: $pureVersion, Legend Shared version: $sharedVersion"
          
          if [ -n "$sharedVersion" ]; then
            mvn versions:set-property -Dproperty=legend.shared.version -DnewVersion=${sharedVersion}
          fi
          if [ -n "$pureVersion" ]; then
            mvn versions:set-property -Dproperty=legend.pure.version -DnewVersion=${pureVersion}
          fi
          if [ -n "$engineVersion" ]; then
            mvn versions:set-property -Dproperty=legend.engine.version -DnewVersion=${engineVersion}
          fi

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Build + Test
        run: mvn clean install javadoc:javadoc -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ

      - name: Configure and start GitLab container
        run: docker run --detach
          --hostname localhost
          --env GITLAB_OMNIBUS_CONFIG="gitlab_rails['initial_root_password'] = 'ac0018BD19066353'"
          --publish 8090:80
          --name gitlab
          gitlab/gitlab-ee:12.10.14-ee.0

      - name: Wait until gitlab container is up and running
        run: sleep 450

      - name: Gitlab Docker Test
        run: mvn verify javadoc:javadoc -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSSZ -P test-gitlab-docker

      - name: Shutdown GitLab container
        run: docker stop gitlab

      - name: Commit Legend Stack Version Upgrade
        run: |
          pureVersion="${{ github.event.client_payload.legendPureVersion }}"
          sharedVersion="${{ github.event.client_payload.legendSharedVersion }}"
          engineVersion="${{ github.event.client_payload.legendEngineVersion }}"
          
          if [ -n "$sharedVersion" ] || [ -n "$engineVersion" ] || [ -n "$pureVersion" ]; then
            git add pom.xml
            git commit -m "Legend Stack Versions upgrade"
            git push origin master
          fi    

      - name: Build and deploy release
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
        run: mvn -B -e -Drevision="${RELEASE_VERSION}" deploy -P release,docker

      - name: Create and push git tag
        env:
          TAG: ${{ github.event.repository.name }}-${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Compute and set next SNAPSHOT
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.releaseVersion }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION}"
          nextSnapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          # Committed onto the commit that was built, deployed and tagged --
          # HEAD, which is the "Legend Stack Versions upgrade" commit when one
          # was made -- never onto whatever the remote tip has become, so the
          # push below is a plain fast-forward: if anything landed on the branch
          # after the check above, git rejects it rather than reverting a
          # <revision> somebody else changed.
          git checkout -B "${GITHUB_REF_NAME}" HEAD
          sed -i "s|<revision>.*</revision>|<revision>${nextSnapshot}</revision>|" pom.xml
          if git diff --quiet -- pom.xml; then
            echo "::error::sed left pom.xml unchanged; set <revision> to ${nextSnapshot} by hand on ${GITHUB_REF_NAME}."
            exit 1
          fi
          git add pom.xml
          git commit -m "Bump version to ${nextSnapshot}"
          git push origin "${GITHUB_REF_NAME}"
