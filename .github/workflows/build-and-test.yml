# The build-once, test-on-every-JDK pipeline, shared by `Build CI` and
# `Release` so that a release is tested exactly the way ordinary CI tests.
# Do not inline a copy of this into a caller: the whole point is that the
# release cannot drift away from what CI does.
#
# The build always runs on JDK 25 and compiles to Java 8 bytecode
# (maven.compiler.release), so every JDK in the matrix runs the same class
# files. Only the forked test JVM changes between legs.
name: Build and Test

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build. Defaults to whatever triggered the caller."
        type: string
        required: false
        default: ''
      jdks:
        description: "JSON array of JDKs for the test matrix. Defaults to the repository/ref heuristic below."
        type: string
        required: false
        default: ''
      sonar:
        description: "Run Sonar analysis over the build and its test reports."
        type: boolean
        required: false
        default: false
      docker-snapshot:
        description: "Build with the docker-snapshot profile."
        type: boolean
        required: false
        default: false
      upload-event-file:
        description: "Upload the triggering event payload, which the `Publish Test Results` workflow needs."
        type: boolean
        required: false
        default: false

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      test-jdks: ${{ steps.test-matrix.outputs.jdks }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Empty means "whatever triggered the caller", which is what CI
          # wants; the release workflow passes the commit it is releasing.
          ref: ${{ inputs.ref }}

      - name: Determine test JDK matrix
        id: test-matrix
        env:
          JDKS: ${{ inputs.jdks }}
        run: |
          set -euo pipefail
          # An explicit list wins: a release exercises every supported JDK no
          # matter which branch it was cut from. Otherwise master builds of
          # the canonical repo exercise every supported JDK, and everything
          # else (PRs, forks, topic branches) sticks to the two boundary
          # versions, which is what keeps ordinary CI turnaround short.
          if [ -n "${JDKS}" ]; then
            echo "jdks=${JDKS}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "finos/legend-sdlc" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo 'jdks=[25, 21, 17, 11]' >> "$GITHUB_OUTPUT"
          else
            echo 'jdks=[25, 11]' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never cache this project's own artifacts: the cache is only
          # refreshed when a pom.xml changes, so cached project jars go stale
          # on Java-only commits and would shadow the current build's output.
          # The test jobs get this build's jars from the archive below.
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/sdlc
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      - name: Download deps and plugins
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Build
        # Tests are skipped here so they run once per JDK in the matrix below
        # rather than once here and again per JDK.
        #
        # PROFILES is deliberately unquoted: it is either empty or a pair of
        # words. `-P docker-snapshot` is passed exactly where the old
        # single-job build passed it. Note that it is a no-op in an `install`
        # build -- the profile binds dockerfile-maven-plugin's build/tag/push
        # to the `deploy` phase, which `install` never reaches -- so no image
        # is pushed here, today or before this change.
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=80.0
          DOCKER_USERNAME: finos
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          PROFILES: ${{ inputs.docker-snapshot && '-P docker-snapshot' || '' }}
        run: mvn -B -e -T 4 -DskipTests ${PROFILES} install javadoc:javadoc -Dorg.slf4j.simpleLogger.showThreadName=true

      - name: Archive build output
        # Bundle the whole workspace (compiled classes, generated sources,
        # test resources) into one file so the test jobs can reuse this build
        # instead of recompiling. The .git dir isn't needed downstream.
        # Also bundle the project's own artifacts that `mvn install` put in
        # the local repository: `mvn surefire:test` resolves inter-module
        # dependencies from ~/.m2, so the test jobs must get THIS build's jars
        # rather than whatever project jars the Maven dependency cache carries.
        run: |
          cp -r ~/.m2/repository/org/finos/legend/sdlc project-artifacts
          tar -cf build-output.tar --exclude='.git' .

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build-output.tar
          retention-days: 1

      - name: Upload CI Event
        # Consumed by the `Publish Test Results` workflow, which only watches
        # `Build CI`; a release run has nothing to publish it to.
        if: ${{ always() && inputs.upload-event-file }}
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  test:
    name: Test (JDK ${{ matrix.jdk }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ fromJSON(needs.build.outputs.test-jdks) }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: build-output

      - name: Extract build output
        run: tar -xf build-output.tar

      - name: Restore Maven dependencies
        # Restore-only: the build job already saved this exact key, so there
        # is nothing here that could be new.
        uses: actions/cache/restore@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never restore this project's own artifacts (see the build job).
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/sdlc
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 25 always: Maven itself runs on the same JDK in every leg, so the
          # only thing that varies is the forked test JVM. The matrix JDK is
          # what that fork will use. When the matrix leg *is* 25 the duplicate
          # is a no-op (second install is a tool-cache hit).
          distribution: 'temurin'
          java-version: |
            25
            ${{ matrix.jdk }}

      - name: Install project artifacts from this build
        # Inter-module dependencies resolve from ~/.m2 during surefire:test,
        # so they must be the jars installed by this run's build job -- never
        # project jars left over in the restored dependency cache.
        run: |
          rm -rf ~/.m2/repository/org/finos/legend/sdlc
          mkdir -p ~/.m2/repository/org/finos/legend
          cp -r project-artifacts ~/.m2/repository/org/finos/legend/sdlc

      - name: Test
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0
        run: |
          # Maven runs on 25 in every leg; the compiled test classes already
          # target Java 8 bytecode, so each leg just points Surefire's forked
          # test JVM at the matrix JDK's install.
          export JAVA_HOME="$JAVA_HOME_25_X64"
          test_jvm_home="JAVA_HOME_${{ matrix.jdk }}_X64"
          TEST_JVM="${!test_jvm_home}/bin/java"
          mvn -B -e surefire:test -Djvm="${TEST_JVM}" -DargLine="-XX:MaxRAMPercentage=50.0" -DforkCount=1

      - name: Upload Test Results
        # Every leg writes to the same repo-relative directory, but each runs
        # in its own workspace, so the per-JDK artifact name is what keeps
        # them apart for `Publish Test Results`.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdk${{ matrix.jdk }}
          path: legend-sdlc-test-reports/surefire-reports-aggregate/*.xml

  sonar:
    name: Sonar
    needs: [build, test]
    # Runs after the tests so the analysis can consume their surefire reports.
    # `always()` on purpose: the reports are uploaded even when a leg is red,
    # and a failure on some other JDK shouldn't cost master its analysis.
    if: >-
      always()
      && inputs.sonar
      && needs.build.result == 'success'
      && github.repository == 'finos/legend-sdlc'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        # Full history: Sonar wants SCM blame for new-code detection.
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: build-output

      - name: Extract build output
        # The tar excludes .git, so it layers cleanly over the checkout above.
        run: tar -xf build-output.tar

      - name: Download JDK 25 test results
        # Tolerate a missing artifact: if the JDK 25 leg died before writing
        # any reports we still want the rest of the analysis.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-results-jdk25
          path: ${{ github.workspace }}/surefire-reports-jdk25

      - name: Restore Maven dependencies
        # Restore-only, as in the test job.
        uses: actions/cache/restore@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never restore this project's own artifacts (see the build job).
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/sdlc
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk

      - name: Install project artifacts from this build
        # Same reasoning as the test job: `sonar:sonar` runs without a
        # lifecycle phase, so inter-module dependencies resolve from ~/.m2 and
        # must be this run's jars.
        run: |
          rm -rf ~/.m2/repository/org/finos/legend/sdlc
          mkdir -p ~/.m2/repository/org/finos/legend
          cp -r project-artifacts ~/.m2/repository/org/finos/legend/sdlc

      - name: Sonar
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=80.0
        run: |
          # The test jobs aggregate every module's surefire XML into one
          # directory rather than the per-module target/surefire-reports, so
          # point every module at the JDK 25 leg's copy of it; each one picks
          # up the reports for the test classes it owns and ignores the rest.
          reports="${GITHUB_WORKSPACE}/surefire-reports-jdk25"
          mkdir -p "${reports}"
          mvn -B -e -P sonar sonar:sonar -Dsonar.junit.reportPaths="${reports}"
